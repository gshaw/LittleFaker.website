$schema: "https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json"
version: "0.2"
language: en
allowCompoundWords: true
ignorePaths:
  - ".git"
  - ".claude"
  - "public"
  - "resources"
  - "tmp"
  - "static"
  # English only: the other languages are checked by reading them.
  - "content/**/*.{de,fr,ja,zh-hans}.md"
  - "i18n/{de,fr,ja,zh-hans}.toml"
words:
  - gshaw
  - littlefaker
  - ogimage # front matter key for the Open Graph image
  - pico
