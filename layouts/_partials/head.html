<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  {{- $description := or .Params.description site.Params.description }}
  <meta name="description" content="{{ $description }}">
  <link rel="canonical" href="{{ .Permalink }}">

  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ $description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ or .Params.ogimage site.Params.ogimage | absURL }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" sizes="any" href="/favicon.192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <link rel="stylesheet" href="/pico.min.css">
  <style>
    h1,
    h2,
    h3,
    h4 {
      margin-bottom: 0.2em
    }

    /* The screenshot: the real screen, rounded. On a phone the left side, mostly empty
       desktop, is cropped off, keeping the menus on the right. */
    .shot {
      margin: 0 0 var(--typography-spacing-vertical)
    }

    .shot img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px
    }

    @media (max-width: 576px) {
      .shot img {
        aspect-ratio: 5 / 6;
        object-fit: cover;
        object-position: right top
      }
    }
  </style>
</head>
